name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows x64 (portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: PCL-N-windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  macos:
    name: macOS (dmg + zip, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dmg / zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: PCL-N-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PCL-N-linux-x64
          path: dist/*.AppImage
          if-no-files-found: error
