<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:">
    <title>Plain Craft Launcher N</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header class="titlebar">
        <div class="tb-left">
            <div class="logo" title="Plain Craft Launcher N">P</div>
            <span class="tb-title">Plain Craft Launcher</span>
            <span class="tb-badge">N</span>
        </div>
        <div class="tb-drag"></div>
        <div class="tb-right">
            <button class="win-btn" id="btn-min" title="最小化"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg></button>
            <button class="win-btn" id="btn-max" title="最大化"><svg viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" fill="none" stroke="currentColor" stroke-width="1.1" rx="1"/></svg></button>
            <button class="win-btn win-close" id="btn-close" title="关闭"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2"/></svg></button>
        </div>
    </header>
    <div class="body">
        <aside class="sidebar">
            <nav class="nav" id="nav"></nav>
            <div class="side-foot">
                <div class="side-version" id="side-version" title="当前选中的版本"></div>
                <div class="side-user" id="side-user" title="离线用户名"></div>
            </div>
        </aside>
        <main class="main" id="main">
            <section class="page" id="page-home"></section>
            <section class="page" id="page-download"></section>
            <section class="page" id="page-settings"></section>
            <section class="page" id="page-help"></section>
        </main>
    </div>
    <div class="taskbar" id="taskbar"></div>
    <div class="statusbar">
        <span id="status-left">就绪</span>
        <span class="grow"></span>
        <span id="status-mid"></span>
        <span id="status-right"></span>
    </div>
</div>
<div id="toast-host" class="toast-host"></div>
<div id="modal-host"></div>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/accounts.js"></script>
<script src="js/home.js"></script>
<script src="js/download.js"></script>
<script src="js/settings.js"></script>
<script src="js/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
